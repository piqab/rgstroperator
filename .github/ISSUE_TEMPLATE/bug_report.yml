name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "`kubectl -n rgstroperator-system get deploy rgstroperator -o jsonpath='{..image}'`"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is the operator installed?
      options:
        - kubectl apply (operator.yaml)
        - Helm chart
        - From source (make run / make deploy)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: "Steps to reproduce, if you have them."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: "`kubectl describe registry <name>`, the Registry YAML and `kubectl -n rgstroperator-system logs deploy/rgstroperator`. Remove passwords and secrets."
      render: text
