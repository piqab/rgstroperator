name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Vet
        run: go vet ./...

      # Fails on vulnerabilities in code paths the operator actually calls.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The CRD, RBAC, deepcopy code, deploy/operator.yaml and the chart are
      # generated: they must be committed up to date.
      - name: Generated files are up to date
        run: |
          make generate bundle
          git diff --exit-code || { echo "::error::run 'make generate bundle' and commit the result"; exit 1; }

      - name: Test (envtest)
        run: make test

      - name: Lint the chart
        run: make chart

  e2e:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        install: [kubectl, helm]
    steps:
      - uses: actions/checkout@v7

      # rgstr is built from source, so the operator is tested against the
      # registry version it defaults to even before that image is published.
      - uses: actions/checkout@v7
        with:
          repository: piqab/rgstr
          path: rgstr

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: End-to-end test in kind
        env:
          INSTALL: ${{ matrix.install }}
          RGSTR_SRC: rgstr
        run: make e2e

  # Cluster mode: three replicas on PostgreSQL and S3 (SeaweedFS) in kind,
  # pulled continuously while the Deployment is rolled and pods deleted.
  e2e-ha:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: piqab/rgstr
          path: rgstr

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Cluster end-to-end test in kind
        env:
          RGSTR_SRC: rgstr
        run: make e2e-ha
