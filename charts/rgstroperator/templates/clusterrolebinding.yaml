apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rgstroperator.name" . }}
  labels: {{- include "rgstroperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rgstroperator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rgstroperator.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
