# Optional: your own auth Secret (spec.auth.secretRef). Every key becomes an
# environment variable of rgstr. Generate password hashes with:
#   docker run --rm --entrypoint /mkpasswd ghcr.io/piqab/rgstr:1.7.0 alice <password>
apiVersion: v1
kind: Secret
metadata:
  name: my-registry-auth
  namespace: default
type: Opaque
stringData:
  RGSTR_AUTH_SECRET: "change-me: openssl rand -hex 32"
  # Temporary password of the first admin (must be changed at first sign-in):
  RGSTR_ADMIN_PASSWORD: "change-me"
  # More users, single-quoted value as printed by mkpasswd:
  # RGSTR_USERS: "alice:$2a$10$..."
