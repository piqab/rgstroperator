apiVersion: registry.rgstr.io/v1alpha1
kind: Registry
metadata:
  name: my-registry
  namespace: default
spec:
  # image: ghcr.io/piqab/rgstr:1.8.0   # default: the release this operator is tested with
  storage:
    size: 20Gi
    # storageClassName: longhorn
    # retainOnDelete: true             # default: deleting the Registry keeps the data

  auth:
    enabled: true
    # Without secretRef the operator creates "my-registry-auth" with a random
    # RGSTR_AUTH_SECRET and a temporary password for the first admin:
    #   kubectl get secret my-registry-auth -o jsonpath='{.data.RGSTR_ADMIN_PASSWORD}' | base64 -d
    # secretRef:
    #   name: my-registry-auth
    admins: [admin]
    sessionTTL: 12h
    # Sign-in with LDAP / Active Directory passwords:
    # ldap:
    #   url: ldaps://dc1.corp.example:636
    #   bindDN: CN=svc-rgstr,OU=Service,DC=corp,DC=example
    #   bindPasswordSecretRef: {name: rgstr-ldap, key: password}
    #   baseDN: DC=corp,DC=example
    #   userFilter: (&(objectClass=user)(sAMAccountName=%s))
    #   adminGroups: [Registry-Admins]
    # "Sign in with ..." through OpenID Connect (Keycloak, Authentik, Entra ID):
    # oidc:
    #   issuer: https://sso.example.com/realms/main
    #   clientID: rgstr
    #   clientSecretRef: {name: rgstr-oidc, key: client-secret}
    #   displayName: Keycloak
    #   adminGroups: [registry-admins]

  # Publish outside the cluster (docker push/pull, kubelet pulls, web admin).
  # Container runtimes need HTTPS: use cert-manager or your own TLS Secret.
  # ingress:
  #   enabled: true
  #   host: registry.example.com
  #   className: nginx
  #   tls:
  #     clusterIssuer: letsencrypt   # or secretName: my-tls

  # Prometheus metrics (/metrics stays inside the cluster):
  # metrics:
  #   enabled: true
  #   serviceMonitor:
  #     enabled: true          # needs the Prometheus Operator
  #     labels: {release: prometheus}

  # Backups of the data volume (kept when the Registry is deleted):
  # backup:
  #   enabled: true
  #   schedule: "0 3 * * *"       # cron, UTC
  #   keep: 7
  #   method: S3                   # rgstr uploads archives itself; or Longhorn, VolumeSnapshot
  #   s3:
  #     bucket: backups
  #     prefix: rgstr/prod
  #     endpoint: https://storage.yandexcloud.net   # empty: AWS S3
  #     secretRef: {name: rgstr-s3}                 # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  #   # method: Longhorn           # RecurringJob; or VolumeSnapshot (any CSI driver)
  #   longhorn:
  #     task: backup               # to the Longhorn backup target; or snapshot
  #   # volumeSnapshotClassName: longhorn-snapshot   # VolumeSnapshot method

  gcInterval: 1h
  uploadTTL: 24h
  # publicRepos: "public/**"

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
