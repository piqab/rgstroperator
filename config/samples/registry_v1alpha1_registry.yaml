apiVersion: registry.rgstr.io/v1alpha1
kind: Registry
metadata:
  name: my-registry
  namespace: default
spec:
  # image: ghcr.io/piqab/rgstr:1.7.0   # default: the release this operator is tested with
  storage:
    size: 20Gi
    # storageClassName: longhorn
    # retainOnDelete: true             # default: deleting the Registry keeps the data

  auth:
    enabled: true
    # Without secretRef the operator creates "my-registry-auth" with a random
    # RGSTR_AUTH_SECRET and a temporary password for the first admin:
    #   kubectl get secret my-registry-auth -o jsonpath='{.data.RGSTR_ADMIN_PASSWORD}' | base64 -d
    # secretRef:
    #   name: my-registry-auth
    admins: [admin]
    sessionTTL: 12h

  gcInterval: 1h
  uploadTTL: 24h
  # publicRepos: "public/**"

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
